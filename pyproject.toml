[tool.poetry]
name = "uniswap-v4-rl-hook"
version = "0.1.0"
description = "RL-Driven Dynamic Fee Hook for Uniswap V4 — Master's Thesis"
authors = ["Sroka"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
gymnasium = "^0.29.1"
stable-baselines3 = {version = "^2.2.1", extras = ["extra"]}
shimmy = "^1.3.0"
numpy = "^1.26.0"
pandas = "^2.1.0"
web3 = "^6.15.0"
torch = "^2.1.0"
tensorboard = "^2.15.0"
matplotlib = "^3.8.0"
scipy = "^1.11.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[profile.default]
src = "contracts/src"
out = "out"
libs = ["contracts/lib"]
test = "contracts/test"
script = "contracts/script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
ffi = true
gas_reports = ["VolatilityFeeHook"]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
anvil = "http://127.0.0.1:8545"
